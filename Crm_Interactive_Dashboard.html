const sel={rep:new Set(),reg:new Set(),sts:new Set(),stg:new Set(),camp:new Set()};

const dlabel=d=>new Date(Date.UTC(2026,0,1+d)).toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'});
// ---------- filter bar
function buildBar(){
  let h='<h1>CRM dashboard</h1>';
  for(const k in F){h+=`<div class=dd data-k=${k}><button type=button><b>${F[k].lbl}</b><span>All</span></button><div class=opts><a class=clr>Clear (show all)</a>${F[k].opts.map((o,i)=>`<label><input type=checkbox value=${i}> ${o}</label>`).join('')}</div></div>`}
  h+='<button type=button class=rs id=rs>Reset filters</button><div class=cnt id=cnt></div>';
  document.getElementById('bar').innerHTML=h;
  document.querySelectorAll('.dd').forEach(dd=>{
    const k=dd.dataset.k;
    dd.querySelector('button').onclick=e=>{const o=dd.classList.contains('open');document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'));if(!o)dd.classList.add('open');e.stopPropagation()};
    dd.querySelector('.opts').onclick=e=>e.stopPropagation();
    dd.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?sel[k].add(+c.value):sel[k].delete(+c.value);render()});
    dd.querySelector('.clr').onclick=()=>{sel[k].clear();render()};
  });
  document.getElementById('rs').onclick=()=>{for(const k in sel)sel[k].clear();render()};
  document.addEventListener('click',()=>document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open')));
}
function syncBar(){
  document.querySelectorAll('.dd').forEach(dd=>{
    const k=dd.dataset.k,s=sel[k];
    dd.querySelectorAll('input').forEach(c=>c.checked=s.has(+c.value));
    dd.querySelector('button').classList.toggle('on',s.size>0);
    dd.querySelector('button span').textContent=s.size==0?'All':s.size==1?F[k].opts[[...s][0]]:s.size+' selected';
  });
}
function toggleOnly(k,i){const s=sel[k];if(s.size==1&&s.has(i))s.clear();else{s.clear();s.add(i)}render()}
// ---------- widgets
function gauge(v,lo,hi,label,col,sub=''){
  const f=Math.max(0,Math.min(1,(v-lo)/(hi-lo))),L=Math.PI*50,th=Math.PI*(1-f),nx=60+44*Math.cos(th),ny=60-44*Math.sin(th);
  return `<div class=gg><div class=gl>${label}</div><svg viewBox="0 0 120 78"><path d="M10,60 A50,50 0 0 1 110,60" fill=none stroke="#4a4a7c" stroke-width=11 /><path d="M10,60 A50,50 0 0 1 110,60" fill=none stroke="${col}" stroke-width=11 stroke-dasharray="${(f*L).toFixed(1)} ${L.toFixed(1)}" /><line x1=60 y1=60 x2=${nx.toFixed(1)} y2=${ny.toFixed(1)} stroke="#fff" stroke-width=3 stroke-linecap=round /><circle cx=60 cy=60 r=5 fill="#fff" /><text x=8 y=74 class=gt>${lo}%</text><text x=112 y=74 text-anchor=end class=gt>${hi}%</text></svg><div class=gv>${v.toFixed(1)}<small>%</small></div><div class=gs>${sub}</div></div>`;
}
const big=(n,l)=>`<div class=bn><strong>${n}</strong><span>${l}</span></div>`;
function bars(vals,labs,W=380,H=150){
  const mx=(Math.max(...vals,1))*1.25,n=vals.length,g=W/n,bw=g*.38;let o='';
  for(const y of [0,.5,1]){const yy=H-22-y*(H-40);o+=`<line x1=0 x2=${W} y1=${yy} y2=${yy} class=gr />`}
  vals.forEach((v,i)=>{const h=v/mx*(H-40),x=i*g+(g-bw)/2;o+=`<rect x=${x.toFixed(1)} y=${(H-22-h).toFixed(1)} width=${bw.toFixed(1)} height=${h.toFixed(1)} fill="#22d3ee"><title>${labs[i]}: ${v}</title></rect><text x=${(x+bw/2).toFixed(1)} y=${(H-26-h).toFixed(1)} text-anchor=middle class=bv>${v}</text><text x=${(x+bw/2).toFixed(1)} y=${H-6} text-anchor=middle class=ax>${labs[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class=ch>${o}</svg>`;
}
function line(vals,labs,W=360,H=190){
  const pts=vals.map((v,i)=>({v,l:labs[i]})).filter(p=>p.v!==null);if(!pts.length)return '<div class=empty>No data</div>';
  const m=pts.reduce((a,p)=>a+p.v,0)/pts.length,sd=Math.sqrt(pts.reduce((a,p)=>a+(p.v-m)**2,0)/Math.max(1,pts.length-1));
  const L=30,B=24,Tp=10,hi=Math.max(...pts.map(p=>p.v),m+sd,4)*1.3,n=vals.length;
  const xs=i=>L+i/(n-1)*(W-L-8),ys=v=>H-B-v/hi*(H-B-Tp);let o='';
  if(pts.length>1)o+=`<rect x=${L} y=${ys(m+sd).toFixed(1)} width=${W-L-8} height=${(ys(Math.max(0,m-sd))-ys(m+sd)).toFixed(1)} fill="#8f8fe0" opacity=.22 />`;
  const step=hi>30?10:4;for(let t=0;t<=hi;t+=step)o+=`<line x1=${L} x2=${W-8} y1=${ys(t).toFixed(1)} y2=${ys(t).toFixed(1)} class=gr /><text x=${L-4} y=${(ys(t)+3).toFixed(1)} text-anchor=end class=ax>${t}%</text>`;
  let path='';vals.forEach((v,i)=>{if(v!==null)path+=(path?'L':'M')+xs(i).toFixed(1)+','+ys(v).toFixed(1)});
  o+=`<path d="${path}" fill=none stroke="#22d3ee" stroke-width=2.4 />`;
  vals.forEach((v,i)=>{if(v!==null)o+=`<circle cx=${xs(i).toFixed(1)} cy=${ys(v).toFixed(1)} r=3 fill="#22d3ee"><title>${labs[i]}: ${v.toFixed(1)}%</title></circle>`;if(i%2==0||i==n-1)o+=`<text x=${xs(i).toFixed(1)} y=${H-6} text-anchor=middle class=ax>${labs[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class=ch>${o}</svg><p class=note>Shaded band = average ± 1 SD of the months shown (${m.toFixed(1)}% ± ${sd.toFixed(1)})</p>`;
}
const lst=(rows,cls='')=>`<ul class="ls ${cls}">`+rows.map(r=>`<li ${r.k?`data-k=${r.k} data-i=${r.i}`:''} class="${r.sel?'sel':''}"><span>${r.a}</span><b>${r.b}</b></li>`).join('')+'</ul>';
// ---------- render
function render(){
  syncBar();
  const R=ROWS.filter(r=>{for(const k in F){const s=sel[k];if(s.size&&!s.has(r[F[k].ix]))return false}return true});
  const N=R.length,tot=ROWS.length;
  document.getElementById('cnt').innerHTML=`Showing <b>${fmt(N)}</b> of ${fmt(tot)} leads`;
  document.getElementById('sub').textContent=` ${fmt(N)} leads · Jan–Sep 2026`;
  const won=R.filter(r=>r[6]==1),lost=R.filter(r=>r[6]==2),open=R.filter(r=>r[6]==0),opp=R.filter(r=>r[5]!=0);
  const overdue=open.filter(r=>r[9]>=0&&r[9]<T).length,stalled=open.filter(r=>T-r[8]>=30).length,old90=open.filter(r=>T-r[7]>90).length;
  const openV=open.reduce((a,r)=>a+r[10],0),wV=open.reduce((a,r)=>a+r[10]*PROB[r[5]]/100,0),wonV=won.reduce((a,r)=>a+r[10],0),lostV=lost.reduce((a,r)=>a+r[10],0);
  const d7=[];for(let d=T-6;d<=T;d++)d7.push(R.filter(r=>r[7]==d).length);
  const dl=[];for(let d=T-6;d<=T;d++)dl.push(dlabel(d));
  const mm=MON.map((_,m)=>{const g=R.filter(r=>r[12]==m);return g.length?g.filter(r=>r[6]==1).length/g.length*100:null});
  const grp=(ix,names)=>names.map((nm,i)=>{const g=R.filter(r=>r[ix]==i);return {nm,i,n:g.length,w:pct(g.filter(r=>r[6]==1).length,g.length),wv:g.filter(r=>r[6]==1).reduce((a,r)=>a+r[10],0)}});
  const camp=grp(4,CAMP).filter(x=>x.n).sort((a,b)=>b.n-a.n),srcs=grp(3,SRC).filter(x=>x.n).sort((a,b)=>b.n-a.n),regs=grp(1,REG),stg=grp(5,STG),reps=grp(0,REP).filter(x=>x.n).sort((a,b)=>b.wv-a.wv),cities=grp(2,CITY).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,8);
  const newest=R.map((r,ix)=>[r,ix]).sort((a,b)=>b[0][7]-a[0][7]||b[1]-a[1]).slice(0,6);
  const smax=Math.max(...stg.map(x=>x.n),1);
  const g=document.getElementById('grid');
  if(!N){g.innerHTML='<div class="t k"><div class=empty>No leads match these filters. Clear a filter to continue.</div></div>';return}
  g.innerHTML=`
<div class="t a"><h2>Leads created (last 7 days)</h2><div class=row>${big(fmt(d7.reduce((a,b)=>a+b,0)),'Total')}${bars(d7,dl)}</div></div>
<div class="t b"><h2>Lead → Won</h2><div class=hero><strong>${pct(won.length,N).toFixed(1)}<small>%</small></strong><span>Leads won (${fmt(won.length)} of ${fmt(N)})</span><div class=ok>✓</div></div>${open.length?gauge(pct(overdue,open.length),0,100,'Open leads with overdue follow-up','#ff6b7a',`${fmt(overdue)} of ${fmt(open.length)} open`):'<div class=empty>No open leads</div>'}</div>
<div class="t c"><h2>Won rate by month</h2>${line(mm,MON)}</div>
<div class="t d"><h2>Funnel</h2><div class=row>${big(fmt(opp.length),'Opportunities')}${gauge(pct(opp.length,N),0,100,'Lead → Opportunity','#3fbf7f')}${gauge(pct(won.length,opp.length),0,30,'Opportunity → Won','#f0b04a')}</div></div>
<div class="t e"><h2>Pipeline health</h2><div class=row>${big(fmt(open.length),'Open leads')}${gauge(pct(stalled,open.length),0,100,'No activity 30+ days','#ff6b7a',fmt(stalled)+' leads')}${gauge(pct(old90,open.length),0,100,'Older than 90 days','#ff6b7a',fmt(old90)+' leads')}</div></div>
<div class="t f"><h2>Value (₹)</h2><div class=vals>${big(cr(openV),'Open pipeline')}${big(cr(wV),'Weighted forecast')}${big(cr(wonV),'Won value')}</div><p class=note>Lost value: ${cr(lostV)} · Lost leads: ${fmt(lost.length)} (${pct(lost.length,N).toFixed(1)}%)</p></div>
<div class="t l"><h2>Sales person leaderboard (by won value)</h2>${lst(reps.map(x=>({k:'rep',i:x.i,sel:sel.rep.has(x.i),a:x.nm+`<em>${fmt(x.n)} leads · ${x.w.toFixed(1)}% won</em>`,b:cr(x.wv)})),'clk')}</div>
<div class="t m"><h2>Leads by city (top 8)</h2>${lst(cities.map(x=>({a:x.nm,b:fmt(x.n)+`<em>${x.w.toFixed(1)}% won</em>`})))}</div>
<div class="t g"><h2>Leads by campaign</h2>${lst(camp.map(x=>({k:'camp',i:x.i,sel:sel.camp.has(x.i),a:x.nm,b:fmt(x.n)+`<em>${x.w.toFixed(1)}% won</em>`})),'clk')}</div>
<div class="t h"><h2>Newest leads (company name)</h2><ul class=ls>${newest.map(([r])=>`<li><span>${NM[r[11]]}<em>${CITY[r[2]]}</em></span><i style="background:${PILL[r[5]]}">${STG[r[5]]}</i></li>`).join('')}</ul></div>
<div class="t i"><h2>Leads by source</h2>${lst(srcs.map(x=>({a:x.nm,b:fmt(x.n)})))}</div>
<div class="t j"><h2>Leads by stage</h2>${stg.map(x=>`<div class="sr ${sel.stg.has(x.i)?'sel':''}" data-k=stg data-i=${x.i}><span>${x.nm}</span><div class=tk><div style="width:${x.n/smax*100}%;background:${PILL[x.i]}"></div></div><b>${fmt(x.n)}</b></div>`).join('')}</div>
<div class="t k"><h2>Leads by region</h2><div class=rgn>${regs.map(x=>`<div class="${sel.reg.has(x.i)?'sel':''}" data-k=reg data-i=${x.i}><span>${x.nm}</span><b>${fmt(x.n)}</b><span>${x.n?x.w.toFixed(1):'0.0'}% won</span></div>`).join('')}</div></div>`;
  g.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>toggleOnly(el.dataset.k,+el.dataset.i));
}
buildBar();render();
</script></body></html>
